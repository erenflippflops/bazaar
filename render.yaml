services:
  - type: web
    name: bazaar-server
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: GAME_TIME_SCALE
        value: 1
      - key: ANTHROPIC_API_KEY
        sync: false
    autoDeploy: true
    branch: main
